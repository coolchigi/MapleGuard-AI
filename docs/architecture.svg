<svg viewBox="0 0 1160 1020" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#C0362C"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#8A8069"/>
    </marker>
  </defs>

  <rect width="1160" height="1020" fill="#F7F5F0"/>

  <!-- title -->
  <text x="48" y="52" font-size="30" font-weight="800" fill="#14110D" letter-spacing="-0.5">MapleGuard — architecture</text>
  <text x="48" y="80" font-size="15" fill="#6E6656">An agent that watches a Canadian immigration case and computes every number from the published government grids, cited to source.</text>
  <text x="48" y="101" font-size="15" fill="#C0362C" font-weight="600">Determinism below the model: the model never computes a score, never asserts eligibility, never submits.</text>

  <!-- ============ ROW A: users + surfaces ============ -->
  <text x="48" y="140" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6E6656">WHO USES IT</text>
  <g font-size="14" fill="#14110D">
    <rect x="48" y="150" width="640" height="62" rx="10" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="68" y="178" font-weight="700">Web app — the proof surface</text>
    <text x="68" y="198" font-size="12" fill="#6E6656">Next.js on Vercel · Dashboard / Profile / Time Machine · candidate + settlement worker</text>

    <rect x="708" y="150" width="404" height="62" rx="10" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="728" y="178" font-weight="700">MCP clients</text>
    <text x="728" y="198" font-size="12" fill="#6E6656">Claude Desktop · an agency's own assistant · any MCP host</text>
  </g>

  <!-- ============ ROW B: access ============ -->
  <text x="48" y="252" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6E6656">ACCESS — the same cited tools, two front doors</text>
  <g font-size="14" fill="#14110D">
    <rect x="48" y="262" width="640" height="58" rx="10" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="68" y="288" font-weight="700">API — FastAPI on AWS Lambda</text>
    <text x="68" y="307" font-size="12" fill="#6E6656" font-family="monospace">/dashboard /pathways /audit /draft /brief /profiles /draws</text>

    <rect x="708" y="262" width="404" height="58" rx="10" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="728" y="288" font-weight="700">MCP server</text>
    <text x="728" y="307" font-size="12" fill="#6E6656" font-family="monospace">AgentCore Runtime · --protocol MCP</text>
  </g>

  <path d="M368 212 V262" stroke="#C0362C" stroke-width="2" marker-end="url(#am)"/>
  <path d="M910 212 V262" stroke="#C0362C" stroke-width="2" marker-end="url(#am)"/>

  <!-- ============ ROW C: the model / multi-agent team ============ -->
  <path d="M368 320 V352 H580 M910 320 V352 H580 M580 352 V366" stroke="#C0362C" stroke-width="2" fill="none" marker-end="url(#am)"/>
  <rect x="48" y="372" width="1064" height="108" rx="12" fill="#FFFFFF" stroke="#14110D" stroke-width="1.5"/>
  <text x="68" y="398" font-size="13" font-weight="800" letter-spacing="1" fill="#14110D">THE MODEL — multi-agent team (Strands Agents) on Amazon Bedrock AgentCore Runtime</text>
  <text x="68" y="417" font-size="12" fill="#6E6656">It routes to specialists and explains their cited results. It computes nothing and asserts nothing.</text>
  <g font-size="13" fill="#14110D">
    <rect x="68" y="430" width="300" height="38" rx="8" fill="#FBEDEB" stroke="#C0362C"/>
    <text x="84" y="454" font-weight="600">advisor</text>
    <text x="150" y="454" font-size="11" fill="#6E6656">routes + explains</text>

    <rect x="392" y="430" width="300" height="38" rx="8" fill="#F0ECE2" stroke="#D8D2C4"/>
    <text x="408" y="454" font-weight="600">strategist</text>
    <text x="486" y="454" font-size="11" fill="#6E6656">position tools</text>

    <rect x="716" y="430" width="330" height="38" rx="8" fill="#F0ECE2" stroke="#D8D2C4"/>
    <text x="732" y="454" font-weight="600">document auditor</text>
    <text x="858" y="454" font-size="11" fill="#6E6656">reference-letter tools</text>
  </g>
  <text x="1046" y="398" font-size="11" fill="#6E6656" font-family="monospace" text-anchor="end">Claude Sonnet 4.5</text>

  <!-- ============ ROW D: the gates (spine) ============ -->
  <path d="M580 480 V506" stroke="#C0362C" stroke-width="2" marker-end="url(#am)"/>
  <rect x="48" y="512" width="1064" height="86" rx="12" fill="#FBEDEB" stroke="#C0362C" stroke-width="2"/>
  <text x="68" y="538" font-size="13" font-weight="800" letter-spacing="1" fill="#C0362C">GATES BELOW THE MODEL — plain Python, run on every request</text>
  <g font-size="13" fill="#14110D">
    <rect x="68" y="550" width="320" height="36" rx="8" fill="#FFFFFF" stroke="#C0362C"/>
    <text x="84" y="573" font-weight="600">never-submit</text>
    <text x="196" y="573" font-size="11" fill="#6E6656">hard · no submit tool exists</text>

    <rect x="412" y="550" width="320" height="36" rx="8" fill="#FFFFFF" stroke="#C0362C"/>
    <text x="428" y="573" font-weight="600">never-assert-eligibility</text>
    <text x="588" y="573" font-size="11" fill="#6E6656">refuses verdicts</text>

    <rect x="756" y="550" width="290" height="36" rx="8" fill="#FFFFFF" stroke="#C0362C"/>
    <text x="772" y="573" font-weight="600">Bedrock Guardrails</text>
    <text x="908" y="573" font-size="11" fill="#3F7A3F">PII redaction · live</text>
  </g>

  <!-- ============ ROW E: deterministic core ============ -->
  <path d="M580 598 V624" stroke="#C0362C" stroke-width="2" marker-end="url(#am)"/>
  <rect x="48" y="630" width="1064" height="116" rx="12" fill="#EFEADD" fill-opacity="0.6" stroke="#14110D" stroke-width="1.5"/>
  <text x="68" y="656" font-size="13" font-weight="800" letter-spacing="1" fill="#14110D">DETERMINISTIC CORE — pure Python, the source of truth</text>
  <text x="68" y="674" font-size="12" fill="#6E6656">Every value carries its source URL + date. Unverifiable data is flagged, never guessed. Validated against IRCC's own calculator.</text>
  <g font-size="12.5" fill="#14110D" font-weight="600">
    <rect x="68" y="690" width="188" height="44" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="84" y="710">crs</text><text x="84" y="726" font-size="10.5" fill="#6E6656" font-weight="400">CRS + time machine</text>
    <rect x="272" y="690" width="188" height="44" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="288" y="710">pnp</text><text x="288" y="726" font-size="10.5" fill="#6E6656" font-weight="400">BC/SK/MB scored · ON/AB/NS gated</text>
    <rect x="476" y="690" width="188" height="44" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="492" y="710">paths</text><text x="492" y="726" font-size="10.5" fill="#6E6656" font-weight="400">pathways + reachable</text>
    <rect x="680" y="690" width="188" height="44" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="696" y="710">noc</text><text x="696" y="726" font-size="10.5" fill="#6E6656" font-weight="400">letter audit + corrected draft</text>
    <rect x="884" y="690" width="162" height="44" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="900" y="710">ingest</text><text x="900" y="726" font-size="10.5" fill="#6E6656" font-weight="400">draws + policy</text>
  </g>

  <!-- ============ ROW F: cited sources feeding the core ============ -->
  <path d="M580 792 V748" stroke="#8A8069" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="48" y="784" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6E6656">CITED FROM OFFICIAL SOURCES (canada.ca)</text>
  <g font-size="12.5" fill="#14110D">
    <rect x="48" y="792" width="256" height="40" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="64" y="817">IRCC rounds of invitations</text>
    <rect x="320" y="792" width="256" height="40" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="336" y="817">NOC 2021 duty text</text>
    <rect x="592" y="792" width="256" height="40" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="608" y="817">provincial PNP grids</text>
    <rect x="864" y="792" width="248" height="40" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
    <text x="880" y="817">IRCC CRS grid</text>
  </g>

  <!-- ============ ROW G: AWS platform rail ============ -->
  <text x="48" y="878" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6E6656">AWS BEDROCK AGENTCORE PLATFORM</text>
  <g font-size="12.5" fill="#14110D">
    <rect x="48" y="886" width="256" height="52" rx="8" fill="#F0ECE2" stroke="#D8D2C4"/>
    <text x="64" y="910" font-weight="600">Memory</text><text x="64" y="928" font-size="10.5" fill="#6E6656">per-user longitudinal profile</text>
    <rect x="320" y="886" width="256" height="52" rx="8" fill="#F0ECE2" stroke="#D8D2C4"/>
    <text x="336" y="910" font-weight="600">Observability</text><text x="336" y="928" font-size="10.5" fill="#6E6656">OTEL trace of every tool call</text>
    <rect x="592" y="886" width="256" height="52" rx="8" fill="#F0ECE2" stroke="#D8D2C4"/>
    <text x="608" y="910" font-weight="600">Knowledge Base</text><text x="608" y="928" font-size="10.5" fill="#6E6656">cited corpus on S3 Vectors</text>
    <rect x="864" y="886" width="248" height="52" rx="8" fill="#F0ECE2" stroke="#D8D2C4"/>
    <text x="880" y="910" font-weight="600">DynamoDB</text><text x="880" y="928" font-size="10.5" fill="#6E6656">profiles · letters PII-scrubbed</text>
  </g>

  <!-- ============ ROW H: autonomous monitor ============ -->
  <rect x="48" y="956" width="1064" height="46" rx="10" fill="#14110D"/>
  <text x="68" y="984" font-size="13" font-weight="700" fill="#F7F5F0">AUTONOMOUS MONITOR</text>
  <text x="240" y="984" font-size="12" fill="#A79C86" font-family="monospace">Lambda on EventBridge, every 6h → reads the rounds feed → the core computes impact → cited alert when your standing moves</text>
</svg>
